<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111820">
<title>IMM DC Tallo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one calm column of soft cards on a warm-grey ground; sticky app bar + filter strip on top, floating tab bar at the bottom on phones, inline tabs on wide screens. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#F6F7F4; --sunk:#ECEEEA; --ink:#111820; --ink-2:#4B5660; --ink-3:#8C959C; --line:#E4E7E2;
  --accent:#111820; --accent-ink:#FFFFFF; --mark:#F2B230; --mark-soft:#FCEFCD;
  --s-stock:#2a78d6; --s-store:#eb6834; --s-cust:#1baf7a;
  --p1:#86b6ef; --p2:#3987e5; --p3:#256abf; --p4:#184f95; --p5:#0d366b;
  --good:#23794A; --good-bg:#E2F2E8; --warn:#9A6100; --warn-bg:#FBEFD3; --crit:#B9382A; --crit-bg:#F9E2DE;
  --f-sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px; --r:16px; --r-sm:11px;
  --shadow:0 1px 2px rgba(17,24,32,.04),0 6px 24px -12px rgba(17,24,32,.18);
  --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1115; --surface:#151C22; --surface-2:#1A232A; --sunk:#10161B; --ink:#EEF2F4; --ink-2:#A9B4BB; --ink-3:#76838B; --line:#26313A;
  --accent:#EEF2F4; --accent-ink:#0C1115; --mark:#E8A91F; --mark-soft:#3A2F14;
  --s-stock:#3987e5; --s-store:#d95926; --s-cust:#199e70;
  --p1:#2a4f80; --p2:#2f6bb8; --p3:#3987e5; --p4:#6da7ec; --p5:#b7d3f6;
  --good:#62C48D; --good-bg:#15302A; --warn:#E5B24F; --warn-bg:#33291A; --crit:#F07D6B; --crit-bg:#3B201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1115; --surface:#151C22; --surface-2:#1A232A; --sunk:#10161B; --ink:#EEF2F4; --ink-2:#A9B4BB; --ink-3:#76838B; --line:#26313A;
  --accent:#EEF2F4; --accent-ink:#0C1115; --mark:#E8A91F; --mark-soft:#3A2F14;
  --s-stock:#3987e5; --s-store:#d95926; --s-cust:#199e70;
  --p1:#2a4f80; --p2:#2f6bb8; --p3:#3987e5; --p4:#6da7ec; --p5:#b7d3f6;
  --good:#62C48D; --good-bg:#15302A; --warn:#E5B24F; --warn-bg:#33291A; --crit:#F07D6B; --crit-bg:#3B201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{padding-top:var(--sat);padding-bottom:var(--sab)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px;border-radius:6px}
.press{transition:transform .14s ease,background-color .2s,border-color .2s,box-shadow .2s}
.press:active{transform:scale(.975)}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#111820;color:#fff;display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#intro.out{opacity:0;visibility:hidden}
.intro-in{display:grid;justify-items:center;gap:18px}
.intro-box{width:92px;height:62px;border:3px solid #F6F7F4;border-radius:9px;position:relative;overflow:hidden;animation:boxIn .7s cubic-bezier(.2,.9,.3,1.2) both}
.intro-box i{position:absolute;top:9px;bottom:9px;width:3px;border-radius:2px;background:#F6F7F4;transform:scaleY(0);animation:rib .35s ease-out both}
.intro-box i:nth-child(1){left:19%;animation-delay:.45s}.intro-box i:nth-child(2){left:38%;animation-delay:.53s}.intro-box i:nth-child(3){left:57%;animation-delay:.61s}.intro-box i:nth-child(4){left:76%;animation-delay:.69s}
.intro-bar{width:92px;height:5px;border-radius:4px;background:#F2B230;transform-origin:left;animation:bar .5s .8s ease-out both;margin-top:-8px}
.intro-word{font-weight:800;font-size:42px;letter-spacing:.08em;display:flex;gap:2px;line-height:1}
.intro-word span{display:inline-block;animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.intro-word span:nth-child(1){animation-delay:.95s}.intro-word span:nth-child(2){animation-delay:1.03s}.intro-word span:nth-child(3){animation-delay:1.11s}
.intro-sub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#AAB4BB;animation:fade .6s 1.25s both;text-align:center}
.intro-load{font-size:12px;color:#7D8A92;animation:fade .4s 1.6s both;min-height:18px}
@keyframes boxIn{from{transform:translateX(-60px) scale(.8);opacity:0}}
@keyframes rib{to{transform:scaleY(1)}}
@keyframes bar{from{transform:scaleX(0)}}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* ---------- app bar ---------- */
.bar{position:sticky;top:var(--sat);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.bar-in{max-width:1120px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{display:block;font-weight:800;font-size:19px;letter-spacing:.04em;line-height:1.05}
.brand small{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs-top{display:none;margin-left:24px;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;position:relative}
.sync{margin-left:auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px 6px 9px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.sync svg{width:15px;height:15px;color:var(--ink-3)}
.sync.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.strip{max-width:1120px;margin:0 auto;padding:2px 16px 10px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.period{display:flex;align-items:center;gap:7px;color:var(--ink)}
.chip.period svg{width:15px;height:15px}
.chip.period .rng{color:var(--ink-3);font-weight:500}
.vsep{width:1px;height:22px;background:var(--line);flex:none;margin:0 2px}

/* ---------- page ---------- */
main{max-width:1120px;margin:0 auto;padding-block:6px 120px;padding-inline:16px;display:grid;gap:14px}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:4px 2px 0}
.hello h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.hello p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.card.pad{padding:16px}
.ch{display:flex;align-items:center;gap:10px;padding:16px 16px 0;flex-wrap:wrap}
.ch h2{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.ch .hint{font-size:12px;color:var(--ink-3)}
.ch .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.cb{padding:12px 16px 16px}
.grid2{display:grid;gap:14px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:var(--r-lg);padding:18px 18px 16px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--mark) 40%,transparent),transparent 70%);opacity:.5;pointer-events:none}
.hero .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;font-weight:600}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:16px;font-weight:600;opacity:.65;margin-left:6px;letter-spacing:0}
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:3px;background:color-mix(in srgb,var(--accent-ink) 14%,transparent)}
.split span{display:block;height:100%;transform-origin:left;animation:grow .9s .2s cubic-bezier(.2,.8,.2,1) both}
.split span:first-child{border-radius:999px 0 0 999px}.split span:last-child{border-radius:0 999px 999px 0}
@keyframes grow{from{transform:scaleX(0)}}
.hero-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hero-row div{min-width:0}
.hero-row .k{font-size:11.5px;opacity:.65;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hero-row .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;font-weight:600}
.tile .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .v small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:3px}
.tile .d{font-size:12px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* insights carousel */
.ins-wrap{display:grid;gap:8px}
.ins-head{display:flex;align-items:center;gap:8px;padding:0 2px}
.ins-head h2{margin:0;font-size:15.5px;font-weight:700}
.ins-head .count{font-size:12px;color:var(--ink-3)}
.ins-head .ins-nav{margin-left:auto;display:flex;gap:6px}
.ibtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.ibtn svg{width:16px;height:16px}
.ins{display:grid;grid-auto-flow:column;grid-auto-columns:min(82%,330px);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;scrollbar-width:none;margin:0 -2px}
.ins::-webkit-scrollbar{display:none}
.icard{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:11px;align-items:start;font-size:13.5px;line-height:1.5}
.icard .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--sunk);color:var(--ink-2)}
.icard .ic svg{width:17px;height:17px}
.icard.h .ic{background:var(--mark-soft);color:var(--warn)} .icard.w .ic{background:var(--warn-bg);color:var(--warn)} .icard.c .ic{background:var(--crit-bg);color:var(--crit)} .icard.g .ic{background:var(--good-bg);color:var(--good)}
.icard b{font-weight:700}
.icard .t{font-weight:700;font-size:12px;color:var(--ink-3);letter-spacing:.02em;margin-bottom:2px}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--line);transition:width .25s,background .25s}
.dots i.on{width:18px;background:var(--ink-3)}
@media (min-width:861px){.ins{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));overflow:visible}.ins-head .ins-nav,.dots{display:none}}

/* bars */
.hbars{display:grid;gap:12px}
.hb{display:grid;gap:5px}
.hb .top{display:flex;align-items:baseline;gap:8px;font-size:13px}
.hb .top .l{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .top .s{color:var(--ink-3);font-size:12px;white-space:nowrap}
.hb .top .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:8px;border-radius:999px;background:var(--sunk);display:flex;gap:2px;overflow:hidden}
.track span{display:block;height:100%;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.track span:last-child{border-radius:0 999px 999px 0}
.hb.click{cursor:pointer;border-radius:10px;margin:-6px -8px;padding:6px 8px}
.hb.click:hover{background:var(--surface-2)}

/* list rows */
.list{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.row:last-child{border-bottom:0}
.row .a{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.row .b{font-size:12.5px;color:var(--ink-3);grid-column:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{grid-row:1/span 2;grid-column:2;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.row .v small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px}
button.row:hover{background:var(--surface-2)}
.more{display:flex;justify-content:center;padding-top:8px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 16px;font-weight:700;font-size:13px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:12.5px}

/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.tag.good{background:var(--good-bg);color:var(--good)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.crit{background:var(--crit-bg);color:var(--crit)} .tag.mark{background:var(--mark-soft);color:var(--warn)}
.bu{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--sunk);color:var(--ink-2)}

/* segmented */
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;position:relative;gap:0}
.seg button{flex:1;border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-3);position:relative;z-index:1;transition:color .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .knob{position:absolute;top:4px;bottom:4px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);transition:left .32s cubic-bezier(.3,.9,.3,1.1),width .32s}
.seg.sm button{padding:6px 11px;font-size:12px}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;position:relative}
.stage{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:11px 8px 10px;text-align:center;display:grid;gap:3px;justify-items:center;position:relative}
.stage[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.stage .sd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.stage .sd svg{width:16px;height:16px}
.stage .n{font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stage .l{font-size:11.5px;font-weight:600;color:var(--ink-2);line-height:1.2}
.stage .x{font-size:11px;color:var(--ink-3)}
.flow{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;display:flex;margin-top:12px}
.flow span{height:100%;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@media (max-width:560px){.pipe{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.stage{padding:9px 2px 8px}.stage .n{font-size:18px}.stage .l{font-size:10.5px}.stage .sd{width:26px;height:26px}.stage .x{display:none}}
.cont{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.cont:last-child{border-bottom:0}
.cont .k{font-family:var(--f-mono);font-weight:600;font-size:13.5px}
.cont .m{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px 10px;flex-wrap:wrap;grid-column:1/-1}
.cont .r{text-align:right;display:grid;gap:3px;justify-items:end}
.steps{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.steps i{height:4px;border-radius:999px;background:var(--sunk)}
.steps i.on{background:var(--p3)}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-family:var(--f-sans);font-size:10.5px;fill:var(--ink-3)}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:gy .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes gy{from{transform:scaleY(0)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:9px 11px;border-radius:12px;font-size:12px;min-width:160px;box-shadow:var(--shadow);z-index:60;display:none}
.tip b{display:block;font-weight:700;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.tip .r span:first-child{display:flex;align-items:center;gap:6px;opacity:.85}

/* schedule */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.dayc{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:8px 12px;display:grid;justify-items:center;gap:0;min-width:62px;scroll-snap-align:start}
.dayc .dn{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.dayc .dd{font-size:20px;font-weight:800;line-height:1.2}
.dayc .dc{font-size:11px;color:var(--ink-3)}
.dayc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dayc[aria-pressed="true"] .dn,.dayc[aria-pressed="true"] .dc{color:var(--accent-ink);opacity:.75}

/* alerts */
.alert{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.alert:last-child{border-bottom:0}
.alert .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}

<script>
'use strict';
// ======================= DATA LAYER =======================
const DOC_IMM='1Dxejz_FVQqE6t3xg6dWsLwlJoB7qBFOyZKRqvsfonQs';
const DOC_RDC='1F2JiOJpp2F7ITOjoMkchLE-HTCYUE6ZODRcvaqRhLwk';
const CACHE_KEY='imm.data.v2';
const QUERIES={
  logic:[DOC_IMM,'LOGIC','select A,B,D,E',0],
  plan:[DOC_IMM,'MASTER_PLAN','select D,E,G,H,I,M,R,W,Z,AA,AB,AC where D is not null',0],
  lc:[DOC_IMM,'MASTER_LC','select A,F,E,S,P,count(T),sum(T),sum(Z) where A is not null group by A,F,E,S,P',1],
  names:[DOC_IMM,'MASTER_LC',"select F,G,count(T) where F is not null and F <> '0' group by F,G",1],
  lph:[DOC_IMM,'LPPBDO_HCI','select A,D,E,F,H,L,M,O,P,Q,R,S,T,W,AA,B,C where E is not null',1],
  lpa:[DOC_IMM,'LPPBDO_AHI','select A,D,E,F,H,L,M,O,P,Q,R,S,T,W,AA,B,C where E is not null',1],
  ven:[DOC_IMM,'VENDOR','select B,G,H,I,J,K,L,M,N,O,P where J is not null',1],
  rdc:[DOC_RDC,'RDC Tallo','select A,B,D,F,H,I,K,M,N,O,P,Q,R,S,T,U,V,W,X,Y,Z,AF where B is not null',1]
};
let D=null, LCSET=new Set(), LCI={}, CONT_BY_LC={}, LCTOT={};
const STATUS={state:'loading',msg:''};
function gvizUrl(doc,sheet,tq,h){return `https://docs.google.com/spreadsheets/d/${doc}/gviz/tq?tqx=out:json&headers=${h}&sheet=${encodeURIComponent(sheet)}&tq=${encodeURIComponent(tq)}`}
function snapshotRows(sheet,tq){
  const S=window.IMM_SNAPSHOT;let t;
  if(sheet==='MASTER_LC'){const m=/A = '([^']+)'/.exec(tq);t=m?(S.DETAIL||{})[m[1]]:(tq.includes('G,count')?S.MASTER_LC_NAMES:S.MASTER_LC_AGG)}else t=S[sheet];
  if(!t)throw new Error('Data contoh untuk '+sheet+' tidak tersedia di pratinjau.');
  return (t.table.rows||[]).map(r=>r.c||[]);
}
async function gviz(doc,sheet,tq,h){
  if(window.IMM_SNAPSHOT){await new Promise(r=>setTimeout(r,120));return snapshotRows(sheet,tq)}
  let res;
  try{res=await fetch(gvizUrl(doc,sheet,tq,h),{cache:'no-store'})}catch(e){throw new Error('Tidak bisa terhubung ke Google Sheets. Cek koneksi internet.')}
  if(!res.ok)throw new Error(`Sheet ${sheet} gagal dibaca (HTTP ${res.status}). Pastikan spreadsheet dibagikan "Siapa saja yang memiliki link".`);
  const txt=await res.text();
  if(!txt.includes('setResponse'))throw new Error(`Sheet ${sheet} tidak bisa dibaca. Pastikan spreadsheet dibagikan "Siapa saja yang memiliki link" sebagai Pelihat.`);
  const j=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));
  if(j.status==='error')throw new Error(`Sheet ${sheet}: ${(j.errors||[]).map(e=>e.detailed_message||e.message).join('; ')}. Cek nama sheet dan kolomnya.`);
  return (j.table.rows||[]).map(r=>r.c||[]);
}
const cv=c=>c?c.v:null;
const cs=c=>{if(!c||c.v==null)return '';if(typeof c.v==='number')return String(c.f!=null?c.f:c.v).replace(/,/g,'').trim();return String(c.v).trim()};
const cn=c=>{if(!c||c.v==null)return 0;if(typeof c.v==='number')return c.v;const n=parseFloat(String(c.v).replace(',','.'));return isNaN(n)?0:n};
const cdate=c=>{const m=/Date\((\d+),(\d+),(\d+)/.exec(String(cv(c)||''));return m?`${m[1]}-${String(+m[2]+1).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`:''};
const ctime=c=>{const m=/Date\(\d+,\d+,\d+,(\d+),(\d+)/.exec(String(cv(c)||''));if(m)return `${m[1].padStart(2,'0')}:${m[2].padStart(2,'0')}`;const f=c&&c.f?String(c.f):'';const t=/(\d{1,2})[:.](\d{2})/.exec(f);return t?`${t[1].padStart(2,'0')}:${t[2]}`:''};
const normLC=x=>String(x??'').replace(/\s+/g,'').toUpperCase();
const BLN_ID={januari:1,februari:2,maret:3,april:4,mei:5,juni:6,juli:7,agustus:8,september:9,oktober:10,november:11,desember:12};
const BUS=['HCI','AHI','FBI','TGI','KWI'];
function buOfCode(code,fb){const p=(code||'')[0];return p==='H'||p==='J'?'HCI':p==='A'?'AHI':p==='F'?'FBI':p==='T'?'TGI':p==='K'?'KWI':(BUS.includes(fb)?fb:'HCI')}
function posKey(p){const s=String(p||'').toLowerCase();return s.includes('poo')?0:s.includes('sail')?1:s.includes('yard')?2:s.includes('door')?3:s.includes('deliver')?4:-1}

function buildModel(R){
  const stock=new Set(),store=new Set();
  R.logic.forEach(r=>{const a=cs(r[0]).toUpperCase(),d=cs(r[2]).toUpperCase();if(a&&a!=='STOCK')stock.add(a);if(d&&d!=='STORE')store.add(d)});
  const cont=[];
  R.plan.forEach(r=>{const d=cdate(r[0]);if(!d)return;const lc=normLC(cs(r[3]));
    cont.push({d,j:ctime(r[1]),k:cs(r[2]),lc:(lc&&lc!=='0'&&lc!=='-')?lc:'',bu:cs(r[4]).toUpperCase(),ps:cn(r[5]),pt:cn(r[6]),pc:cn(r[7]),exp:cs(r[8]),fl:cs(r[9]),fr:cs(r[10]),te:cn(r[11])})});
  const first={};cont.slice().sort((a,b)=>(a.d+a.j).localeCompare(b.d+b.j)).forEach(c=>{if(c.lc&&!(c.lc in first))first[c.lc]=c.d});
  const codes=[],ci={},depts=[],di={},lcs=[],li={},raw={},lcAll={};
  const idx=(arr,map,k)=>{if(!(k in map)){map[k]=arr.length;arr.push(k)}return map[k]};
  const rows=[],unm={};
  R.lc.forEach(r=>{const rl=cs(r[0]);const lc=normLC(rl);if(!lc)return;raw[lc]=raw[lc]||rl;
    const ks=cs(r[1]).toUpperCase(),tp=cs(r[2]).toUpperCase(),dept=cs(r[3])||'-',site=cs(r[4]).toUpperCase();
    const dest=stock.has(ks)?0:(!ks||ks==='0')?2:1;const code=dest===2?(tp||'-'):ks;const bu=buOfCode(code,site);
    const n=cn(r[5]),qty=cn(r[6]),cbm=cn(r[7]);
    (lcAll[lc]=lcAll[lc]||[0,0,0,0])[dest]+=cbm;lcAll[lc][3]+=n;
    if(first[lc])rows.push([idx(lcs,li,lc),dest,idx(codes,ci,code),idx(depts,di,dept),n,qty,cbm,BUS.indexOf(bu)]);
    else{const k=lc+'|'+bu;const u=unm[k]||(unm[k]=[lc,bu,0,0,0,0]);u[2+dest]+=cbm;u[5]+=n}
  });
  const un=Object.values(unm).map(u=>[u[0],u[1],+u[2].toFixed(3),+u[3].toFixed(3),+u[4].toFixed(3),u[5]]);
  const nm={};R.names.forEach(r=>{const c=cs(r[0]).toUpperCase();if(!c)return;const n=cs(r[1]).replace(/^\s*\(.*?\)\s*/,'').trim();if(!n)return;(nm[c]=nm[c]||{})[n]=(nm[c][n]||0)+cn(r[2])});
  const names={};Object.entries(nm).forEach(([c,o])=>{names[c]=Object.entries(o).sort((a,b)=>b[1]-a[1])[0][0]});
  const lp=[];
  [...R.lph,...R.lpa].forEach(r=>{const no=cs(r[2]);if(!no)return;
    let d='';const t=cs(r[14]).split(/\s+/);
    if(t.length>=3&&BLN_ID[t[1].toLowerCase()])d=`${t[2]}-${String(BLN_ID[t[1].toLowerCase()]).padStart(2,'0')}-${String(+t[0]).padStart(2,'0')}`;
    if(!d){const y=(/\/(20\d\d)\//.exec(no)||[])[1]||String(new Date().getFullYear());const m=BLN_ID[cs(r[16]).toLowerCase()];const dd=cn(r[15]);if(m&&dd)d=`${y}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}`}
    if(!d)return;
    let st=cs(r[10]);st=st?st.toLowerCase().replace(/\b\w/g,m=>m.toUpperCase()).replace(/\bCis\b/g,'CIS'):'-';
    lp.push({d,bu:cs(r[1]).toUpperCase(),no,si:cs(r[3]),k:cs(r[11]).toUpperCase(),st,up:cs(r[0]).toUpperCase(),dp:cs(r[13])||'-',a:cs(r[5]),ds:cs(r[6]),od:cn(r[7]),rc:cn(r[8]),q:cn(r[12]),rm:cs(r[9])})});
  const yn=c=>cs(c).toUpperCase()==='YA'?1:0;
  const ven=[];R.ven.forEach(r=>{const d=cdate(r[0]);if(!d)return;ven.push([d,cs(r[3]),cs(r[1]).toUpperCase(),cn(r[2]),yn(r[6]),yn(r[5]),yn(r[7]),yn(r[8]),yn(r[9]),yn(r[10])])});
  const rdc=[];
  R.rdc.forEach(r=>{const si=normLC(cs(r[1]));if(!si)return;const pos=cs(r[15]);
    rdc.push({org:cs(r[0]),si,ty:cs(r[2]),dd:cdate(r[3]),moda:cs(r[4]),k:cs(r[5]),kap:cs(r[6]),etd:cdate(r[7]),atd:cdate(r[8]),eta:cdate(r[9]),ata:cdate(r[10]),doc:cdate(r[11]),rqd:cdate(r[12]),acd:cdate(r[13]),bk:cdate(r[14]),pos,p:posKey(pos),st:cs(r[16]),ks:cs(r[17]).toUpperCase(),bu:(cs(r[18])||'').toUpperCase(),ag:cs(r[19])===''?null:cn(r[19]),agk:cs(r[20]),sla:cs(r[21]).toLowerCase()})});
  const now=new Date();
  return {snap:`${iso(now)}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
    stock:[...stock],cont,lcs,lcd:lcs.map(l=>first[l]),codes,names,depts,rows,un,lp,ven,raw,lcAll,rdc};
}
function reindex(){
  LCSET=new Set(D.lcs);LCI=Object.fromEntries(D.lcs.map((l,i)=>[l,i]));
  CONT_BY_LC={};D.cont.forEach(c=>{if(c.lc)(CONT_BY_LC[c.lc]=CONT_BY_LC[c.lc]||[]).push(c)});
  LCTOT={};D.rows.forEach(r=>{const t=LCTOT[r[0]]||(LCTOT[r[0]]=[0,0,0]);t[r[1]]+=r[6]});
}
let loading=null;
function loadData(manual){
  if(loading)return loading;
  STATUS.state=D?'refreshing':'loading';STATUS.msg='';renderStatus();
  loading=(async()=>{
    try{
      const keys=Object.keys(QUERIES);
      const res=await Promise.all(keys.map(k=>gviz(...QUERIES[k]).catch(e=>{if(k==='rdc')return {__err:e.message};throw e})));
      const R=Object.fromEntries(keys.map((k,i)=>[k,res[i]]));
      let rdcErr='';if(R.rdc&&R.rdc.__err){rdcErr=R.rdc.__err;R.rdc=[]}
      D=buildModel(R);D.rdcErr=rdcErr;reindex();
      STATUS.state='ok';
      if(!window.IMM_SNAPSHOT){try{localStorage.setItem(CACHE_KEY,JSON.stringify(D))}catch(e){}}
      if(manual)toast('Data diperbarui');
    }catch(e){STATUS.state='error';STATUS.msg=e.message||String(e);if(manual&&D)toast('Gagal memperbarui. Memakai data terakhir.')}
    loading=null;render();
  })();
  return loading;

function lcList(rows,q){
  const g=groupBy(rows,r=>r[0],k=>({k,cbm:0,sku:0,qty:0,dep:new Set(),bu:new Set()}),(g,r)=>{g.cbm+=r[6];g.sku+=r[4];g.qty+=r[5];g.dep.add(r[3]);g.bu.add(BUS[r[7]])});
  let arr=g.map(x=>{const lc=D.lcs[x.k];const c=(CONT_BY_LC[lc]||[])[0];return {...x,lc,d:D.lcd[x.k],c}}).sort((a,b)=>(a.d+(a.c?.j||'')).localeCompare(b.d+(b.c?.j||'')));
  if(q){const Q=q.toUpperCase().replace(/\s+/g,'');arr=arr.filter(x=>x.lc.includes(Q)||(x.c&&x.c.k.toUpperCase().replace(/\s+/g,'').includes(Q)))}
  return arr;
}
function lcRows(arr,mode,key){const n=lim(key);return `<div class="list">${arr.slice(0,n).map(x=>`<button class="row press" data-lc="${esc(x.lc)}" data-mode="${mode}"><span class="a"><span class="mono">${esc(x.lc)}</span>${[...x.bu].map(buTag).join('')}</span><span class="b">${dday(x.d)}${x.c?` · ${x.c.j} · ${esc(x.c.k)}`:''} · ${x.dep.size} dept · ${f0(x.sku)} SKU</span><span class="v">${f2(x.cbm)}<small>CBM</small></span></button>`).join('')}</div>${moreBtn(key,arr.length,n)}`}

function monLpp(){
  const [from,to]=range(),X=slice(from,to),L=X.lp;const lpBus=new Set(D.lp.map(x=>x.bu));
  const docs=new Set(L.map(x=>x.no)),qty=L.reduce((a,x)=>a+x.q,0),open=L.filter(x=>x.up!=='DONE'||x.st==='Pending');

    return `<section class="card" style="--i:2">${noBU?emptyState('Belum ada LPPBDO untuk BU ini','Saat ini hanya ada LPPBDO HCI dan AHI.',false,I.doc):emptyState('Tidak ada LPPBDO','LPPBDO dicatat setelah barang dibongkar, jadi periode ke depan biasanya kosong.',true,I.doc)}</section>`}

  const art=groupBy(L,x=>x.a,k=>({k,n:0,q:0,ds:''}),(g,x)=>{g.n++;g.q+=x.q;g.ds=x.ds}).filter(a=>a.n>1).sort((a,b)=>b.n-a.n);
  const delivered=D.rdc.filter(r=>r.p===4&&buOK(r.bu)&&(r.bk||r.ata)>=from&&(r.bk||r.ata)<=to).length;
  const ins=[];

  if(delivered)ins.push({h:'Rasio',t:`<b>${f1(docs.size/delivered*100)} dokumen per 100 kontainer</b> yang dibongkar (${delivered} kontainer di RDC Tallo).`});
  ins.push({c:kat[0].k==='DAMAGE GOODS'?'w':'',h:'Masalah utama',t:`<b>${KAT[kat[0].k]||esc(kat[0].k)}</b>: ${kat[0].n} item (${pc(kat[0].n,L.length)}%)${kat[1]?`, lalu ${(KAT[kat[1].k]||kat[1].k).toLowerCase()} ${pc(kat[1].n,L.length)}%`:''}.`});
  if(site.length>1)ins.push({h:'Asal kiriman',t:`Paling sering dari <b>${esc(site[0].k)}</b> (${pc(site[0].n,L.length)}% item).`});
  {const d0=dep.find(d=>d.k!=='(dept kosong)');const dk=dep.find(d=>d.k==='(dept kosong)');if(d0)ins.push({h:'Dept',t:`Dept terbanyak <span class="mono">${esc(d0.k)}</span>: ${d0.n} item, ${f0(d0.q)} pcs.${dk?` ${dk.n} item belum diisi dept-nya.`:''}`})}
  if(art.length)ins.push({c:'w',h:'Artikel berulang',t:`<span class="mono">${esc(art[0].k)}</span> ${esc(art[0].ds)} muncul ${art[0].n}×. Cek kemasan atau data OD di asal.`});
  ins.push(open.length?{c:'c',h:'Belum selesai',t:`<b>${open.length} item</b> masih pending. Lihat daftar dokumen di bawah.`}:{c:'g',h:'Status',t:'Semua item sudah selesai (DONE).'});
  const span=(from<'1000'||to>'9000')?999:days(from,to);
  const jOf=x=>x.k==='DAMAGE GOODS'?0:(x.k==='GOODS WITHOUT OD'||x.k==='OD WITHOUT GOODS')?1:2;
  const TS=[{name:'Rusak',color:'var(--s-store)'},{name:'Selisih OD',color:'var(--s-stock)'},{name:'Kurang/lebih/lain',color:'var(--s-cust)'}];

  const q=(S.q.lpp||'').toUpperCase();if(q)docList=docList.filter(d=>d.k.toUpperCase().includes(q)||d.items.some(i=>(i.a+' '+i.ds+' '+i.dp).toUpperCase().includes(q)));

  return `

  </div>

    <section class="card"><div class="ch"><h2>Dept terbanyak</h2></div><div class="cb">${hbars(dep.map(s=>({l:`<span class="mono">${esc(s.k)}</span>`,s:`${f0(s.q)} pcs`,vt:`${s.n} item`,v:s.n,color:'var(--ink-3)'})))}</div></section>

    <div class="cb" style="padding-top:4px">${docList.length?`<div class="list">${docList.slice(0,n).map(d=>`<button class="row press" data-lpp="${esc(d.k)}"><span class="a"><span class="mono" style="font-size:12.5px">${esc(d.k)}</span>${buTag(d.bu)}${d.open?tag('Pending','crit'):''}</span><span class="b">${dshort(d.d)} · ${esc(d.si)} · ${d.kat.map(k=>KAT[k]||k).join(', ')}</span><span class="v">${f0(d.q)}<small>${d.items.length} item</small></span></button>`).join('')}</div>${moreBtn('lpp',docList.length,n)}`:emptyState('Tidak ditemukan','Tidak ada dokumen yang cocok.',false,I.search)}</div></section>`;
}

// ======================= SHEETS (DETAIL) =======================
function sheet(head,body){const host=document.getElementById('sheetHost');host.innerHTML='';host.innerHTML=`<div class="scrim" data-close></div><section class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${head}<div class="sb">${body}</div></section>`;document.body.style.overflow='hidden';bindSheetDrag();setTimeout(()=>host.querySelector('.sh .x')?.focus(),50)}
function closeSheet(){const host=document.getElementById('sheetHost');const s=host.querySelector('.sheet');if(!s||s.classList.contains('closing'))return;s.classList.add('closing');const sc=host.querySelector('.scrim');if(sc){sc.style.transition='opacity .2s';sc.style.opacity='0'}setTimeout(()=>{if(s.isConnected){s.remove();sc&&sc.remove();if(!host.querySelector('.sheet'))document.body.style.overflow=''}},200)}
function bindSheetDrag(){const s=document.querySelector('.sheet');const g=s&&s.querySelector('.grab');if(!g||innerWidth>=760)return;let y0=null,dy=0;
  const st=e=>{y0=e.touches[0].clientY;dy=0;s.style.transition='none'};const mv=e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);s.style.transform=`translateY(${dy}px)`};
  const en=()=>{s.style.transition='transform .2s';if(dy>90)closeSheet();else s.style.transform='';y0=null};
  [g,s.querySelector('.sh')].forEach(el=>{el.addEventListener('touchstart',st,{passive:true});el.addEventListener('touchmove',mv,{passive:true});el.addEventListener('touchend',en)})}
const sHead=(t,meta,badge='',mono=true)=>`<div class="sh"><div class="t1"><h3 class="${mono?'mono':''}">${t}</h3>${badge}<button class="x press" data-close aria-label="Tutup">${I.x}</button></div>${meta?`<div class="meta">${meta}</div>`:''}</div>`;
function openPeriod(){
  const months=[...new Set(D?D.cont.map(c=>c.d.slice(0,7)).concat(D.lp.map(x=>x.d.slice(0,7))):[])].sort().reverse();const [a,b]=range();
  const sub={today:dshort(TODAY),tomorrow:dshort(addD(TODAY,1)),next7:`${dshort(TODAY)} – ${dshort(addD(TODAY,6))}`};
  sheet(sHead('Pilih periode','Berlaku untuk semua menu','',false),`<div class="pgrid">${PRESETS.map(([k,l])=>`<button class="popt press" data-preset="${k}" aria-pressed="${S.preset===k}">${l}${sub[k]?`<small>${sub[k]}</small>`:''}</button>`).join('')}</div>
   <div class="field"><label for="pmonth">Pilih bulan</label><select id="pmonth"><option value="">—</option>${months.map(m=>{const [y,mm]=m.split('-').map(Number);return `<option value="${m}" ${S.preset==='month'&&S.month===m?'selected':''}>${BLNL[mm-1]} ${y}</option>`}).join('')}</select></div>
   <div class="field"><label>Rentang tanggal</label><div class="two"><input type="date" id="pfrom" value="${a<'1000'?TODAY:a}" aria-label="Dari"><input type="date" id="pto" value="${b>'9000'?TODAY:b}" aria-label="Sampai"></div><button class="btn press" id="papply" style="margin-top:4px">Terapkan rentang</button></div>`)}
function openCont(i){const c=D.cont[i];if(c.lc&&LCSET.has(c.lc)){openLC(c.lc,'all');return}
  sheet(sHead(esc(c.k||'Tanpa no. kontainer'),`<span><b>${dlong(c.d)}</b> ${c.j}</span><span>BU <b>${c.bu}</b></span><span>${esc(c.exp)} · ${esc(c.fl)} · ${esc(c.fr)}</span>`,tag(c.lc?'LC tidak ada di MASTER_LC':'Tanpa No LC','crit')),
  `<div><h4>Plan di MASTER_PLAN</h4><div class="cmp">${[['Stock',c.ps,'var(--s-stock)'],['Store',c.pt,'var(--s-store)'],['Customer',c.pc,'var(--s-cust)']].map(([k,v,col])=>`<div><div class="k"><i class="dot" style="background:${col}"></i>${k}</div><div class="v">${f2(v)}</div><div class="p">CBM plan</div></div>`).join('')}</div></div>
   <p style="margin:0;color:var(--ink-2)">${c.lc?`No LC <span class="mono">${esc(c.lc)}</span> belum ada di MASTER_LC, jadi isi dept dan SKU-nya belum bisa ditampilkan.`:'Baris ini tidak punya No LC. Isi No LC di MASTER_PLAN agar CBM-nya ikut terhitung.'}</p>`)}
function openLC(lc,mode){
  const k=LCI[lc];if(k==null){const r=D.rdc.find(x=>x.si===lc);if(r){openRdc(D.rdc.indexOf(r));return}toast('LC belum ada di MASTER_PLAN');return}
  const cs_=CONT_BY_LC[lc]||[];const c=cs_[0];const R=D.rows.filter(r=>r[0]===k&&(mode==='S'?r[1]===0:mode==='O'?r[1]>0:true));const t=LCTOT[k];
  const dep=groupBy(R,r=>r[3]+'|'+r[1],x=>({d:+x.split('|')[0],t:+x.split('|')[1],cbm:0,sku:0,qty:0}),(g,r)=>{g.cbm+=r[6];g.sku+=r[4];g.qty+=r[5]}).sort((a,b)=>a.t-b.t||b.cbm-a.cbm);
  const plan=c?[c.ps,c.pt,c.pc]:[0,0,0];const col=['var(--s-stock)','var(--s-store)','var(--s-cust)'];const rid='sku'+k;
  const rdc=D.rdc.find(x=>x.si===lc);
  sheet(sHead(esc(lc),`${cs_.map(c=>`<span><b>${dday(c.d)}</b> ${c.j}</span><span class="mono">${esc(c.k)}</span><span>${c.bu} · ${esc(c.exp)} · ${esc(c.fl)}</span>`).join('')}`,tag(mode==='S'?'Storing':mode==='O'?'Outbound':'Semua tujuan')),
  `<div><h4>Plan vs MASTER_LC</h4><div class="cmp">${['Storing','Store','Customer'].map((n,j)=>{const d=t[j]-plan[j];return `<div><div class="k"><i class="dot" style="background:${col[j]}"></i>${n}</div><div class="v">${f2(t[j])}</div><div class="p">plan ${f2(plan[j])}${Math.abs(d)>=.5?` · <span style="color:var(--warn);font-weight:700">${d>0?'+':''}${f1(d)}</span>`:''}</div></div>`}).join('')}</div></div>
   ${rdc?`<div><h4>Posisi (RDC Tallo)</h4><button class="row press" data-rdc="${D.rdc.indexOf(rdc)}" style="padding-top:0"><span class="a">${esc(rdc.pos||'-')} ${rdc.p===4?tag('Delivered','good'):''}</span><span class="b">${esc(rdc.org)} · kirim ${dshort(rdc.dd)}${rdc.eta?` · ETA ${dshort(rdc.eta)}`:''}</span><span class="v" style="color:var(--ink-3)">${I.chev}</span></button></div>`:''}
   <div><h4>Per dept</h4>${hbars(dep.map(d=>({l:`<span class="mono">${esc(D.depts[d.d])}</span>`,s:`${DEST[d.t]} · ${f0(d.sku)} SKU · ${f0(d.qty)} pcs`,vt:f2(d.cbm),v:d.cbm,color:col[d.t]})))}</div>
   <div><h4>Isi SKU <span id="${rid}-n" style="font-weight:500;color:var(--ink-3);font-size:12px"></span></h4><label class="search" style="margin-bottom:8px">${I.search}<input type="search" placeholder="Cari SKU atau deskripsi" id="${rid}-q" aria-label="Cari SKU" disabled></label><div class="tw" id="${rid}"><div class="sk" style="height:120px"></div></div></div>`);
  showSku(lc,mode,rid);
}
async function showSku(lc,mode,rid){const box=()=>document.getElementById(rid);
  try{const all=await loadSkuDetail(lc);const sk=all.filter(x=>mode==='S'?x.dest===0:mode==='O'?x.dest>0:true);if(!box())return;
    document.getElementById(rid+'-n').textContent=`· ${sk.length} SKU`;const q=document.getElementById(rid+'-q');q.disabled=false;box().innerHTML=skuTable(sk,'');q.addEventListener('input',()=>{box().innerHTML=skuTable(sk,q.value)})}
  catch(e){if(box())box().innerHTML=`<p style="margin:0;color:var(--ink-2)">Isi SKU belum bisa dimuat. ${esc(e.message)}</p><button class="btn ghost sm press" data-lc="${esc(lc)}" data-mode="${mode}" style="margin-top:8px">Coba lagi</button>`}}
function skuTable(sk,q){const Q=q.trim().toUpperCase();const f=Q?sk.filter(r=>(r.sku+' '+r.desc+' '+r.dept).toUpperCase().includes(Q)):sk;
  return `<div class="list">${f.slice(0,150).map(r=>`<div class="row"><span class="a" style="font-weight:600;font-size:13px">${esc(r.desc)}</span><span class="b"><span class="mono">${esc(r.sku)}</span> · ${esc(r.dept)} · ${r.dest===0?'Storing':esc(r.code)+(r.dest===2?' cust':'')} · ${f0(r.qty)} pcs</span><span class="v">${f2(r.cbm)}<small>CBM</small></span></div>`).join('')}</div>${f.length>150?`<p class="foot">Menampilkan 150 dari ${f.length}. Gunakan pencarian.</p>`:''}${!f.length?'<p class="foot">Tidak ada SKU yang cocok.</p>':''}`}
function openRdc(i){const r=D.rdc[i];const pl=CONT_BY_LC[r.si]||[];const cb=D.lcAll[r.si];
  const ms=[['Kirim dari asal',r.dd],['Kapal berangkat (ETD)',r.etd],['Berangkat (ATD)',r.atd],['Perkiraan tiba (ETA)',r.eta],['Tiba di pelabuhan (ATA)',r.ata],['Dokumen diterima',r.doc],['Request dooring',r.rqd],['Dooring',r.acd],['Bongkar di DC',r.bk]];
  sheet(sHead(esc(r.k||'—'),`<span class="mono">${esc(r.si)}</span><span>BU <b>${esc(r.bu||'-')}</b></span><span>${esc(r.org)}</span><span>${esc(r.ty)}</span>${r.kap?`<span>${esc(r.kap)}</span>`:''}`,tag(esc(r.pos||'-'),r.p===4?'good':r.p===2?'mark':'')),
  `<div><h4>Perjalanan</h4><div class="tl">${ms.map(([n,d])=>`<div class="st ${d?'done':''}"><i></i><span class="n">${n}</span><span class="d">${d?dday(d):'–'}</span></div>`).join('')}</div></div>
   <div class="cmp"><div><div class="k">Aging</div><div class="v">${r.ag!=null?r.ag+' hr':'–'}</div><div class="p">${esc(r.agk||'')}</div></div><div><div class="k">SLA dokumen</div><div class="v" style="font-size:16px;padding-top:4px">${r.sla?esc(r.sla==='late'?'Terlambat':r.sla==='faster'?'Lebih cepat':r.sla):'–'}</div></div><div><div class="k">CBM (LC)</div><div class="v">${cb?f1(cb[0]+cb[1]+cb[2]):'–'}</div><div class="p">${cb?`stock ${f1(cb[0])}`:'belum di MASTER_LC'}</div></div></div>
   <div><h4>Jadwal bongkar</h4>${pl.length?pl.map(c=>`<button class="row press" data-lc="${esc(r.si)}" data-mode="all"><span class="a">${dlong(c.d)}</span><span class="b">${c.j} · ${esc(c.k)} · ${esc(c.exp)}</span><span class="v" style="color:var(--ink-3)">${I.chev}</span></button>`).join(''):`<p style="margin:0;color:var(--ink-2)">${r.p===4?'Sudah delivered.':'Belum ada di MASTER_PLAN. Jadwalkan bongkar setelah kontainer tiba di Yard.'}</p>`}</div>`)}
function openUnscheduled(){
  const u=D.un.filter(x=>buOK(x[1])).map(x=>({lc:x[0],bu:x[1],s:x[2],o:x[3],c:x[4],n:x[5],d:lcDate(x[0])})).sort((a,b)=>b.d.localeCompare(a.d));
  const byM=groupBy(u,x=>x.d.slice(0,7),k=>({k,n:0,cbm:0}),(g,x)=>{g.n++;g.cbm+=x.s+x.o+x.c}).sort((a,b)=>b.k.localeCompare(a.k));
  sheet(sHead('LC belum dijadwalkan',`<span><b>${u.length}</b> LC</span><span><b>${f1(u.reduce((a,x)=>a+x.s+x.o+x.c,0))}</b> CBM</span>`,'',false),
  `<p style="margin:0;color:var(--ink-2)">Ada di MASTER_LC tapi belum ada di MASTER_PLAN, jadi belum dihitung di menu mana pun. Bisa jadi kontainernya masih di jalan, atau No LC di plan ditulis berbeda.</p>
   <div><h4>Per bulan LC</h4>${hbars(byM.map(m=>{const[y,mm]=m.k.split('-').map(Number);return {l:`${BLNL[mm-1]} ${y}`,s:`${m.n} LC`,vt:f1(m.cbm),v:m.cbm,color:'var(--ink-3)'}}))}</div>
   <div><h4>Daftar</h4><div class="list">${u.slice(0,120).map(x=>{const r=D.rdc.find(z=>z.si===x.lc);return `<div class="row"><span class="a"><span class="mono">${esc(x.lc)}</span>${buTag(x.bu)}${r?tag(esc(r.pos),r.p===4?'good':''):''}</span><span class="b">${x.n} SKU · stock ${f1(x.s)} · store ${f1(x.o)} · cust ${f1(x.c)}</span><span class="v">${f1(x.s+x.o+x.c)}<small>CBM</small></span></div>`}).join('')}</div></div>`)}
function openMissing(){const [from,to]=range();const m=slice(from,to).cont.filter(c=>!c.lc||!LCSET.has(c.lc));
  sheet(sHead('Kontainer belum terhitung',`<span><b>${m.length}</b> baris plan</span><span>${esc(rlabel())}</span>`,'',false),
  `<div class="list">${m.map(c=>`<button class="row press" data-cont="${D.cont.indexOf(c)}"><span class="a"><span class="mono">${esc(c.k||'—')}</span>${buTag(c.bu)}${tag(c.lc?'LC tidak ada':'Tanpa LC',c.lc?'crit':'warn')}</span><span class="b">${dday(c.d)} ${c.j} · ${esc(c.lc||'—')}</span><span class="v">${f1(c.ps+c.pt+c.pc)}<small>CBM plan</small></span></button>`).join('')}</div>`)}
function openLpp(no){const items=D.lp.filter(x=>x.no===no);const f=items[0];
  sheet(sHead(esc(no),`<span><b>${dlong(f.d)}</b></span><span>BU <b>${f.bu}</b></span><span>Asal <b>${esc(f.si)}</b></span>`),
  `<div class="list">${items.map(i=>`<div class="row"><span class="a" style="font-size:13px">${esc(i.ds)}</span><span class="b" style="white-space:normal"><span class="mono">${esc(i.a)}</span> · ${KAT[i.k]||esc(i.k)} · OD ${f0(i.od)} / terima ${f0(i.rc)}${i.rm?`<br>${esc(i.rm)}`:''}</span><span class="v">${f0(i.q)}<small>${esc(i.up)} · ${esc(i.st)}</small></span></div>`).join('')}</div>`)}

// ======================= EVENTS =======================
document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s);let t;
  if(g('#sync')||g('[data-reload]')){loadData(true);return}
  if(t=g('[data-tab]')){setPage(t.dataset.tab);return}
  if(t=g('[data-bu]')){const v=t.dataset.bu;if(v==='ALL')S.bus=new Set(BUS);else if(allBU())S.bus=new Set([v]);else{S.bus.has(v)?S.bus.delete(v):S.bus.add(v);if(!S.bus.size)S.bus=new Set(BUS)}S.more={};render(true);return}
  if(t=g('[data-open]')){({period:openPeriod,uns:openUnscheduled,miss:openMissing})[t.dataset.open]();return}
  if(t=g('[data-preset]')){S.preset=t.dataset.preset;S.more={};closeSheet();render(true);return}
  if(g('#papply')){S.from=document.getElementById('pfrom').value||TODAY;S.to=document.getElementById('pto').value||TODAY;S.preset='range';closeSheet();render(true);return}
  if(t=g('[data-qp]')){S.preset=t.dataset.qp;render(true);return}
  if(t=g('[data-segv]')){const s=t.closest('[data-seg]').dataset.seg;S[s]=t.dataset.segv;if(s==='monTab')saveUI();S.more={};render(s==='monTab');return}
  if(t=g('[data-stage]')){S.stage=+t.dataset.stage;S.more.rdc=0;render();return}
  if(t=g('[data-day]')){S.dayPick=t.dataset.day;render();return}
  if(t=g('[data-more]')){S.more[t.dataset.more]=(S.more[t.dataset.more]||0)+20;render();return}
  if(t=g('[data-car]')){const el=document.getElementById(t.dataset.car);if(el){const w=el.firstElementChild.offsetWidth+10;el.scrollBy({left:w*+t.dataset.dir,behavior:'smooth'})}return}
  if(t=g('[data-lq]')){S.q.lpp=t.dataset.lq;render();setTimeout(()=>document.querySelector('[data-q="lpp"]')?.scrollIntoView({behavior:'smooth',block:'center'}),50);return}
  if(t=g('[data-lc]')){openLC(t.dataset.lc,t.dataset.mode||'all');return}
  if(t=g('[data-cont]')){openCont(+t.dataset.cont);return}
  if(t=g('[data-rdc]')){openRdc(+t.dataset.rdc);return}
  if(t=g('[data-lpp]')){openLpp(t.dataset.lpp);return}
  if(g('[data-close]')){closeSheet();return}
});
document.addEventListener('change',e=>{if(e.target.id==='pmonth'&&e.target.value){S.month=e.target.value;S.preset='month';closeSheet();render(true)}});
let qT;document.addEventListener('input',e=>{const k=e.target.dataset.q;if(!k)return;S.q[k]=e.target.value;S.more[k]=0;clearTimeout(qT);qT=setTimeout(()=>{const pos=e.target.selectionStart;render();const el=document.querySelector(`[data-q="${k}"]`);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}},180)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
addEventListener('resize',()=>{placePills();placeKnobs()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{placePills();placeKnobs()});
// pull to refresh
(function(){const ptr=document.getElementById('ptr');let y0=null,dy=0;
  addEventListener('touchstart',e=>{if(scrollY<=0&&!document.querySelector('.sheet'))y0=e.touches[0].clientY;else y0=null},{passive:true});
  addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){ptr.style.transition='none';ptr.style.transform=`translateY(${Math.min(dy*.5,70)-70}px) rotate(${dy*2}deg)`}},{passive:true});
  addEventListener('touchend',()=>{if(y0==null)return;ptr.style.transition='';if(dy>110){ptr.style.transform='translateY(0)';ptr.classList.add('spin');loadData(true).finally(()=>{ptr.classList.remove('spin');ptr.style.transform=''})}else ptr.style.transform='';y0=null;dy=0})})();

// ======================= RENDER =======================
function render(anim){
  renderShell();const m=document.getElementById('main');
  if(!D){m.className='';m.innerHTML=STATUS.state==='error'?`<section class="card">${emptyState('Data belum bisa dimuat',esc(STATUS.msg),false,I.crit)}<div class="empty" style="padding-top:0"><button class="btn press" data-reload>Coba lagi</button></div></section>`:`<div class="sk" style="height:46px;width:60%"></div><div class="sk" style="height:170px"></div><div class="sk" style="height:110px"></div><div class="sk" style="height:240px"></div>`;return}
  const html=(window.IMM_SNAPSHOT?`<div class="preview-note">Pratinjau dengan data contoh dari spreadsheet. Di aplikasi, semua data dibaca langsung dari Google Sheets.</div>`:'')+({home:pageHome,stock:pageStock,out:pageOut,mon:pageMon})[S.page]();
  m.className='';if(anim){void m.offsetWidth;m.className='enter'}m.innerHTML=html;placeKnobs();requestAnimationFrame(placeKnobs);if(anim)countUp(m);
  if(location.hash.slice(1)!==S.page)history.replaceState(null,'','#'+S.page);
}
(function boot(){
  const t0=performance.now();
  if(!window.IMM_SNAPSHOT){try{const c=localStorage.getItem(CACHE_KEY);if(c){D=JSON.parse(c);reindex()}}catch(e){D=null}}
  const p=loadData();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const reveal=()=>{const el=document.getElementById('intro');if(!el||el.classList.contains('out'))return;render(true);el.classList.add('out');setTimeout(()=>el.remove(),500)};
  const minT=reduce?0:1900;
  const go=()=>setTimeout(reveal,Math.max(0,minT-(performance.now()-t0)));
  if(D)go();else{p.finally(go);setTimeout(reveal,7000)}
  let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(Date.now()-hiddenAt>5*60e3)loadData()});
})();
</script>
</body>
