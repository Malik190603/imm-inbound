<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111820">
<title>IMM DC Tallo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<script>try{var t=localStorage.getItem('imm.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* Layout: one calm column of borderless cards on a warm-grey ground; sticky app bar + per-menu filter strip, floating 5-tab bar on phones, inline tabs on wide screens. */
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --surface-2:#F7F8F5; --sunk:#ECEEEA; --ink:#111820; --ink-2:#4B5660; --ink-3:#8C959C; --line:#E6E9E4;
  --accent:#111820; --accent-ink:#FFFFFF; --mark:#F2B230; --mark-soft:#FCEFCD;
  --s-stock:#1baf7a; --s-store:#eb6834; --s-cust:#2a78d6;
  --bu-hci:#2a78d6; --bu-ahi:#e34948; --bu-tgi:#6dbaf2; --bu-fbi:#7a5ad8; --bu-kwi:#f08a24; --bu-x:#9aa3a9;
  --p1:#86b6ef; --p2:#3987e5; --p3:#256abf; --p4:#184f95; --p5:#0d366b;
  --lg1:#86b6ef; --lg2:#256abf; --lg3:#F2B230; --on1:#0d2a4f; --on2:#fff; --on3:#3b2a00;
  --good:#23794A; --good-bg:#E2F2E8; --warn:#9A6100; --warn-bg:#FBEFD3; --crit:#B9382A; --crit-bg:#F9E2DE;
  --f-sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px; --r:16px;
  --shadow:0 1px 2px rgba(17,24,32,.04),0 10px 30px -18px rgba(17,24,32,.22);
  --card-border:transparent;
  --ease:cubic-bezier(.22,.8,.24,1);
  --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1115; --surface:#151C22; --surface-2:#1A232A; --sunk:#10161B; --ink:#EEF2F4; --ink-2:#A9B4BB; --ink-3:#76838B; --line:#232E36;
  --accent:#EEF2F4; --accent-ink:#0C1115; --mark:#E8A91F; --mark-soft:#3A2F14;
  --s-stock:#199e70; --s-store:#d95926; --s-cust:#3987e5;
  --bu-hci:#3987e5; --bu-ahi:#e66767; --bu-tgi:#7cc4f6; --bu-fbi:#9a85ea; --bu-kwi:#f29a45; --bu-x:#6d7a82;
  --p1:#2a4f80; --p2:#2f6bb8; --p3:#3987e5; --p4:#6da7ec; --p5:#b7d3f6;
  --lg1:#6da7ec; --lg2:#2f6bb8; --lg3:#E8A91F; --on1:#0b1d33; --on2:#fff; --on3:#2b1f00;
  --good:#62C48D; --good-bg:#15302A; --warn:#E5B24F; --warn-bg:#33291A; --crit:#F07D6B; --crit-bg:#3B201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.7); --card-border:#1E2830; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1115; --surface:#151C22; --surface-2:#1A232A; --sunk:#10161B; --ink:#EEF2F4; --ink-2:#A9B4BB; --ink-3:#76838B; --line:#232E36;
  --accent:#EEF2F4; --accent-ink:#0C1115; --mark:#E8A91F; --mark-soft:#3A2F14;
  --s-stock:#199e70; --s-store:#d95926; --s-cust:#3987e5;
  --bu-hci:#3987e5; --bu-ahi:#e66767; --bu-tgi:#7cc4f6; --bu-fbi:#9a85ea; --bu-kwi:#f29a45; --bu-x:#6d7a82;
  --p1:#2a4f80; --p2:#2f6bb8; --p3:#3987e5; --p4:#6da7ec; --p5:#b7d3f6;
  --lg1:#6da7ec; --lg2:#2f6bb8; --lg3:#E8A91F; --on1:#0b1d33; --on2:#fff; --on3:#2b1f00;
  --good:#62C48D; --good-bg:#15302A; --warn:#E5B24F; --warn-bg:#33291A; --crit:#F07D6B; --crit-bg:#3B201C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.7); --card-border:#1E2830; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{padding-top:var(--sat);padding-bottom:var(--sab);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;transition:background-color .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px;border-radius:8px}
.press{transition:transform .16s var(--ease),background-color .2s,border-color .2s,box-shadow .2s,opacity .2s}
.press:active{transform:scale(.97)}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#111820;color:#fff;display:grid;place-items:center;transition:opacity .7s var(--ease),transform .9s var(--ease),visibility .7s}
#intro.out{opacity:0;transform:scale(1.04);visibility:hidden}
.intro-in{display:grid;justify-items:center;gap:20px;animation:introFloat 2.4s var(--ease) both}
.intro-logo{width:112px;height:84px}
.intro-logo .box{fill:none;stroke:#F6F7F4;stroke-width:3.5;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.1s .1s var(--ease) forwards}
.intro-logo .rib{stroke:#F6F7F4;stroke-width:3;stroke-linecap:round;opacity:0;transform-box:fill-box;transform-origin:center;animation:ribIn .5s var(--ease) forwards}
.intro-logo .rib:nth-of-type(2){animation-delay:.55s}.intro-logo .rib:nth-of-type(3){animation-delay:.63s}.intro-logo .rib:nth-of-type(4){animation-delay:.71s}.intro-logo .rib:nth-of-type(5){animation-delay:.79s}
.intro-logo .base{stroke:#F2B230;stroke-width:5;stroke-linecap:round;stroke-dasharray:90;stroke-dashoffset:90;animation:draw .7s .85s var(--ease) forwards}
.intro-word{font-weight:800;font-size:40px;letter-spacing:.42em;margin-right:-.42em;line-height:1;opacity:0;animation:word 1s 1s var(--ease) forwards}
.intro-sub{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:#AAB4BB;text-align:center;line-height:1.7;opacity:0;animation:fadeUp .8s 1.35s var(--ease) forwards}
.intro-copy{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 28px);text-align:center;font-size:11.5px;letter-spacing:.08em;color:#6F7C84;opacity:0;animation:fadeUp .8s 1.6s var(--ease) forwards}
.intro-copy b{color:#AAB4BB;font-weight:600}
#intro.leaving .intro-word,#intro.leaving .intro-sub,#intro.leaving .intro-load,#intro.leaving .intro-copy{transition:opacity .25s ease,transform .35s var(--ease);opacity:0!important;transform:translateY(-6px)}
#intro.leaving{background:transparent;transition:background-color .7s var(--ease)}
#intro.leaving::before{content:"";position:absolute;inset:0;background:#111820;animation:bgOut .75s .05s var(--ease) forwards}
@keyframes bgOut{to{opacity:0}}
#intro.leaving .intro-in{position:relative;z-index:1}
.fly{position:fixed;z-index:120;border-radius:12px;display:grid;place-items:center;pointer-events:none;will-change:transform}
.fly svg{width:22px;height:22px}
.mark.hide{visibility:hidden}
.intro-load{font-size:12px;color:#7D8A92;min-height:18px;opacity:0;animation:fadeUp .6s 1.8s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ribIn{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
@keyframes word{from{opacity:0;letter-spacing:.9em;filter:blur(6px)}to{opacity:1;letter-spacing:.42em;filter:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes introFloat{from{transform:translateY(10px)}to{transform:none}}
@keyframes fade{from{opacity:0}}

/* ---------- app bar ---------- */
.bar{position:sticky;top:var(--sat);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px)}
.bar-in{max-width:1120px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{display:block;font-weight:800;font-size:19px;letter-spacing:.06em;line-height:1.05}
.brand small{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs-top{display:none;margin-left:20px;gap:2px;background:var(--sunk);padding:4px;border-radius:999px;position:relative}
.sync{margin-left:auto;display:flex;align-items:center;gap:7px;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:7px 12px 7px 10px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;transition:background .3s}
.sync svg{width:15px;height:15px;color:var(--ink-3)}
.sync.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.strip{max-width:1120px;margin:0 auto;padding:2px 16px 10px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip .bd{width:8px;height:8px;border-radius:50%}
.chip.period{color:var(--ink)}
.chip.period svg{width:15px;height:15px}
.chip.period .rng{color:var(--ink-3);font-weight:500}
.vsep{width:1px;height:22px;background:var(--line);flex:none;margin:0 2px}

/* ---------- page ---------- */
main{max-width:1120px;margin:0 auto;padding-block:6px 124px;padding-inline:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
main>*,.ins-wrap{min-width:0}
.enter>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.hello{padding:6px 2px 0}
.hello h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.hello p{margin:3px 0 0;color:var(--ink-3);font-size:13px}
.card{background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card.pad{padding:16px}
.ch{display:flex;align-items:center;gap:10px;padding:16px 16px 0;flex-wrap:wrap}
.ch h2{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.ch .hint{font-size:12px;color:var(--ink-3)}
.ch .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.cb{padding:12px 16px 16px}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:var(--r-lg);padding:18px 18px 16px;display:grid;gap:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--mark) 45%,transparent),transparent 70%);opacity:.45;pointer-events:none}
.hero .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;font-weight:600}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:16px;font-weight:600;opacity:.65;margin-left:6px;letter-spacing:0}
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:3px;background:color-mix(in srgb,var(--accent-ink) 14%,transparent)}
.split span{display:block;height:100%;transform-origin:left;animation:grow 1s .25s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.hero-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hero-row div{min-width:0}
.hero-row .k{font-size:11.5px;opacity:.65;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hero-row .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);border-radius:var(--r);padding:13px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;font-weight:600}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:3px}
.tile .d{font-size:12px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* insights */
.ins-wrap{display:grid;gap:8px}
.ins-head{display:flex;align-items:center;gap:8px;padding:0 2px}
.ins-head h2{margin:0;font-size:15.5px;font-weight:700}
.ins-head .count{font-size:12px;color:var(--ink-3)}
.ins-head .ins-nav{margin-left:auto;display:flex;gap:6px}
.ibtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink-2)}
.ibtn svg{width:16px;height:16px}
.ins{display:grid;grid-auto-flow:column;grid-auto-columns:min(84%,330px);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none;margin:0 -2px}
.ins::-webkit-scrollbar{display:none}
.icard{scroll-snap-align:start;background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:11px;align-items:start;font-size:13.5px;line-height:1.5}
.icard .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--sunk);color:var(--ink-2)}
.icard .ic svg{width:17px;height:17px}
.icard.h .ic{background:var(--mark-soft);color:var(--warn)} .icard.w .ic{background:var(--warn-bg);color:var(--warn)} .icard.c .ic{background:var(--crit-bg);color:var(--crit)} .icard.g .ic{background:var(--good-bg);color:var(--good)}
.icard b{font-weight:700}
.icard .t{font-weight:700;font-size:12px;color:var(--ink-3);letter-spacing:.02em;margin-bottom:2px}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--line);transition:width .3s var(--ease),background .3s}
.dots i.on{width:18px;background:var(--ink-3)}
@media (min-width:861px){.ins{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));overflow:visible}.ins-head .ins-nav,.dots{display:none}}

/* bars */
.hbars{display:grid;gap:13px;grid-template-columns:minmax(0,1fr)}
.hb{display:grid;gap:6px;min-width:0}
.hb .top{display:flex;align-items:baseline;gap:8px;font-size:13px;min-width:0}
.hb .top .l>span{overflow:hidden;text-overflow:ellipsis}
.hb .top .l>span.mono{flex:none}
.hb .top .l{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.hb .top .s{color:var(--ink-3);font-size:12px;white-space:nowrap}
.hb .top .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:8px;border-radius:999px;background:var(--sunk);display:flex;gap:2px;overflow:hidden}
.track span{display:block;height:100%;transform-origin:left;animation:grow .9s var(--ease) both}
.track span:last-child{border-radius:0 999px 999px 0}
.trow{display:flex;align-items:center;gap:12px;min-width:0}
.trow .track{flex:1}
.pct{flex:none;min-width:44px;text-align:right;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--sunk);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.hb .top .v small{font-weight:500;color:var(--ink-3);font-size:11.5px;margin-left:3px}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.type{border:1.5px solid transparent;background:var(--surface-2);border-radius:16px;padding:11px 11px 10px;text-align:left;display:grid;gap:2px;min-width:0}
.type .k{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;font-weight:700}
.type .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.type .p{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type[aria-pressed="true"]{border-color:var(--tc);background:var(--surface);box-shadow:var(--shadow)}
.type:disabled{opacity:.45}
.pick{border:1.5px dashed var(--line);border-radius:16px;padding:18px 14px;text-align:center;color:var(--ink-3);font-size:13px}
.lcd{animation:rise .45s var(--ease) both}
.lt-head{display:grid;gap:14px;margin-bottom:16px}
.lt-big{font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.lt-big .u{font-size:18px;font-weight:700;letter-spacing:0;margin-left:6px;color:var(--ink-2)}
.lt-sub{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.lt-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.lt-chip{background:var(--surface-2);border-radius:14px;padding:9px 11px;font-size:11.5px;color:var(--ink-3);display:grid;line-height:1.3;align-content:start}
.lt-chip b{font-size:15px;color:var(--ink);font-weight:800}
.lt-chip.good b{color:var(--good)} .lt-chip.bad b{color:var(--crit)}
.jr{background:var(--surface-2);border-radius:18px;padding:12px 12px 14px;margin-bottom:6px}
.jr-ends{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:10px}
.jr-ends span{display:inline-flex;align-items:center;gap:5px}
.jr-ends svg{width:14px;height:14px}
.jr-track{display:flex;gap:4px}
.jr-leg{min-width:0;display:grid;gap:4px;align-content:start;animation:rise .6s var(--ease) both}
.jr-bar{height:34px;border-radius:10px;background:var(--c);display:grid;place-items:center;color:var(--o);font-size:13px;font-weight:800;white-space:nowrap;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.jr-n{font-size:12px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.jr-one{height:34px;border-radius:10px;background:var(--lg2);color:var(--on2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;transform-origin:left;animation:grow .9s var(--ease) both}
.jr-one i{display:none}
.jr-note{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:11.5px;line-height:1.4;color:var(--ink-3)}
.jr-note svg{width:15px;height:15px;flex:none;margin-top:1px}
.jr-d{font-size:10.5px;color:var(--ink-3);line-height:1.25}
.lt-sec{font-size:14px;font-weight:700;margin:18px 0 10px;display:flex;align-items:baseline;gap:8px}
.lt-sec span{font-size:12px;font-weight:500;color:var(--ink-3)}
.orgs{display:grid;gap:12px;margin-top:6px}
button.org{border:0;background:none;padding:0;width:100%;text-align:left;font:inherit;color:inherit}
.lt-hint{font-size:11.5px;color:var(--ink-3);margin:8px 2px 4px;line-height:1.4}
.org{display:grid;gap:6px;min-width:0}
.org-top{display:flex;align-items:baseline;gap:8px;min-width:0}

function range(){
  const f=F(),t=TODAY,d=pd(t),dow=(d.getDay()+6)%7;
  const mS=(y,m)=>iso(new Date(y,m,1)),mE=(y,m)=>iso(new Date(y,m+1,0));
  switch(f.preset){
    case 'today':return [t,t];case 'tomorrow':return [addD(t,1),addD(t,1)];case 'next7':return [t,addD(t,6)];
    case 'thisweek':return [addD(t,-dow),addD(t,6-dow)];case 'lastweek':return [addD(t,-dow-7),addD(t,-dow-1)];
    case 'last30':return [addD(t,-29),t];case 'thismonth':return [mS(d.getFullYear(),d.getMonth()),mE(d.getFullYear(),d.getMonth())];
    case 'lastmonth':return [mS(d.getFullYear(),d.getMonth()-1),mE(d.getFullYear(),d.getMonth()-1)];
    case 'ytd':return [`${d.getFullYear()}-01-01`,t];
    case 'month':{const [y,m]=f.month.split('-').map(Number);return [mS(y,m-1),mE(y,m-1)]}
    case 'range':return f.from<=f.to?[f.from,f.to]:[f.to,f.from];
    default:return ['0000-01-01','9999-12-31'];
  }
}
function plabel(){const f=F();if(f.preset==='month'){const [y,m]=f.month.split('-').map(Number);return `${BLNL[m-1]} ${y}`}if(f.preset==='range')return 'Rentang';return PRESETS.find(p=>p[0]===f.preset)[1]}

function whenWord(){const p=F().preset;return p==='today'?'hari ini':p==='tomorrow'?'besok':esc(rlabel())}
function slice(from,to){

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(Math.max(x,1e-9))));const m=x/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
function stackChart(id,buckets,series,o={}){
  const U=o.unit||'CBM',FM=o.fmt||f1;const W=720,H=220,L=40,R=6,T=10,B=26;
  const max=Math.max(1,...buckets.map(b=>b.vals.reduce((a,c)=>a+c,0)));const step=niceStep(max/4),top=Math.ceil(max/step)*step;
  const n=buckets.length,bw=(W-L-R)/n,barW=Math.max(4,Math.min(30,bw*.6));const y=v=>T+(H-T-B)*(1-v/top);
  let g='';for(let v=0;v<=top+1e-9;v+=step)g+=`<line class="${v===0?'base':'grid'}" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${f0(v)}</text>`;
  const every=Math.ceil(n/8);
  buckets.forEach((b,i)=>{const cx=L+bw*i+bw/2;let acc=0,segs='';const nz=b.vals.map((v,j)=>[v,j]).filter(x=>x[0]>0);
    nz.forEach(([v,j],k)=>{const y0=y(acc),y1=y(acc+v);const hh=Math.max(0,y0-y1-(k<nz.length-1?2:0));const tp=k===nz.length-1,r=Math.min(5,barW/2,hh);
      segs+=tp&&hh>r?`<path d="M${cx-barW/2},${y0} V${y0-hh+r} q0,-${r} ${r},-${r} H${cx+barW/2-r} q${r},0 ${r},${r} V${y0}Z" fill="${series[j].color}"/>`:`<rect x="${cx-barW/2}" y="${y0-hh}" width="${barW}" height="${hh}" fill="${series[j].color}"/>`;acc+=v});
    g+=`<g class="bar" style="animation-delay:${i*28}ms">${segs}</g><rect class="hit" data-i="${i}" x="${L+bw*i}" y="${T}" width="${bw}" height="${H-T-B}"/>`;
    if(i%every===0)g+=`<text class="ax" x="${cx}" y="${H-7}" text-anchor="middle">${b.label}</text>`});
  setTimeout(()=>bindTip(id,buckets,series,U,FM),0);
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik ${U}">${g}</svg></div>`;
}
function bindTip(id,buckets,series,U,FM){const el=document.getElementById(id);if(!el)return;const tip=document.getElementById('tip');
  el.querySelectorAll('.hit').forEach(h=>{const show=()=>{const b=buckets[+h.dataset.i];const tot=b.vals.reduce((a,c)=>a+c,0);
    tip.innerHTML=`<b>${b.full}</b>`+series.map((s,j)=>`<div class="r"><span><i class="dot" style="background:${s.color}"></i>${s.name}</span><span>${FM(b.vals[j])}</span></div>`).join('')+`<div class="r" style="margin-top:4px;padding-top:4px;border-top:1px solid rgba(127,127,127,.35)"><span>Total ${U}</span><span>${FM(tot)}</span></div>${b.extra?`<div class="r"><span>${b.extra[0]}</span><span>${b.extra[1]}</span></div>`:''}`;
    tip.style.display='block';const r=h.getBoundingClientRect();const tw=tip.offsetWidth;let x=r.left+r.width/2-tw/2+scrollX;x=Math.max(8,Math.min(x,innerWidth-tw-8));tip.style.left=x+'px';tip.style.top=(r.top+scrollY-tip.offsetHeight+24)+'px';h.style.fill='rgba(127,127,127,.10)'};
    const hide=()=>{tip.style.display='none';h.style.fill=''};h.addEventListener('mouseenter',show);h.addEventListener('mouseleave',hide);h.addEventListener('click',e=>{e.stopPropagation();show();buzz(5);clearTimeout(h._t);h._t=setTimeout(hide,2600)})})}
function bucketize(from,to,items,getDate,getVals,nS,extraFn){
  let a=from,b=to;if(a<'1000'||b>'9000'){const ds=items.map(getDate).filter(Boolean).sort();if(!ds.length)return [];a=ds[0];b=ds[ds.length-1]}
  const span=days(a,b);const mode=span>120?'m':span>45?'w':'d';const map=new Map();
  const keyOf=d=>mode==='d'?d:mode==='w'?addD(d,-((pd(d).getDay()+6)%7)):d.slice(0,7)+'-01';
  for(let d=keyOf(a);d<=b;d=mode==='d'?addD(d,1):mode==='w'?addD(d,7):iso(new Date(pd(d).getFullYear(),pd(d).getMonth()+1,1))){
    const dd=pd(d);map.set(d,{key:d,mode,label:mode==='m'?BLN[dd.getMonth()]:mode==='w'?dshort(d):(span>10?String(dd.getDate()):HARI[dd.getDay()]+' '+dd.getDate()),full:mode==='m'?`${BLNL[dd.getMonth()]} ${dd.getFullYear()}`:mode==='w'?`Minggu ${dshort(d)} – ${dshort(addD(d,6))}`:dlong(d),vals:Array(nS).fill(0)})}
  items.forEach(it=>{const dd=getDate(it);if(!dd)return;const bk=map.get(keyOf(dd));if(!bk)return;getVals(it).forEach((v,j)=>bk.vals[j]+=v)});
  const arr=[...map.values()];if(extraFn)arr.forEach(extraFn);return arr;
}

function countUp(root){if(reduced())return;root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,dec=+el.dataset.dec||0;if(!isFinite(to)||to===0)return;const fm=dec===1?f1:dec===2?f2:f0;const t0=performance.now(),dur=850;

function lcList(rows,q){
  const g=groupBy(rows,r=>r[0],k=>({k,cbm:0,sku:0,qty:0,dep:new Set(),bu:new Set()}),(g,r)=>{g.cbm+=r[6];g.sku+=r[4];g.qty+=r[5];g.dep.add(r[3]);g.bu.add(BUS[r[7]])});
  let arr=g.map(x=>{const lc=D.lcs[x.k];const c=(CONT_BY_LC[lc]||[])[0];return {...x,lc,d:D.lcd[x.k],c}}).sort((a,b)=>(a.d+(a.c?.j||'')).localeCompare(b.d+(b.c?.j||'')));
  if(q){const Q=q.toUpperCase().replace(/\s+/g,'');arr=arr.filter(x=>x.lc.includes(Q)||(x.c&&x.c.k.toUpperCase().replace(/\s+/g,'').includes(Q)))}
  return arr;
}
function lcRows(arr,mode,key){const n=lim(key);return `<div class="list">${arr.slice(0,n).map(x=>`<button class="row press" data-lc="${esc(x.lc)}" data-mode="${mode}"><span class="a"><span class="mono">${esc(x.lc)}</span>${[...x.bu].map(buTag).join('')}</span><span class="b">${dday(x.d)}${x.c?` · ${x.c.j} · ${esc(x.c.k)}`:''} · ${x.dep.size} dept · ${f0(x.sku)} SKU</span><span class="v">${f2(x.cbm)}<small>CBM</small></span></button>`).join('')}</div>${moreBtn(key,arr.length,n)}`}

  <div style="--i:2">${insights('Ringkasan pintar',ins)}</div>

    <section class="card"><div class="ch"><span class="hic">${I.stock}</span><h2>Per dept</h2><span class="hint">${dep.length} dept</span><div class="right" style="flex:1 1 160px;max-width:220px">${searchBox('dept','Cari dept')}</div></div><div class="cb">${dep.length?hbars(dep.slice(0,nd).map(d=>({l:`<span class="mono">${esc(D.depts[d.k])}</span>`,s:`${d.lc.size} LC · ${f0(d.sku)} SKU`,vt:`${f1(d.cbm)}<small>CBM</small>`,pct:pc(d.cbm,cbm),v:d.cbm,color:'var(--s-stock)'}))):emptyState('Dept tidak ditemukan','Coba kata kunci lain.',false,I.search)}${moreBtn('dept',dep.length,nd)}</div></section>

const rdcCbm=si=>{const t=D.lcAll[si];return t?t[0]+t[1]+t[2]:null};
const LEG_N=['Tunggu kapal','Berlayar','Di pelabuhan'],LEG_C=[1,2,3].map(i=>`var(--lg${i});--o:var(--on${i})`);
const bkOf=r=>r.bk||r.acd||r.ata;
const startOf=r=>r.ck||r.dd;
const dd_=(a,b)=>a&&b?Math.max(0,diff(a,b)):null;

// ======================= PENGGUNA (jumlah unduhan dari GitHub Releases) =======================
// Tiap HP mengunduh tiap versi paling banyak sekali (APK baru, atau paket update kilat .zip),
// jadi jumlah unduhan per versi ≈ jumlah HP di versi itu; angka tertinggi = perkiraan jumlah perangkat.
S.stats=LS.get('imm.stats')||null;let statsBusy=false;
async function loadStats(force){
  if(statsBusy||!CFG.updateRepo)return;if(!force&&S.stats&&Date.now()-S.stats.at<10*60e3)return;statsBusy=true;
  try{const r=await fetch(`https://api.github.com/repos/${CFG.updateRepo}/releases?per_page=50`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);const js=await r.json();
    const vs=js.filter(x=>!x.draft).map(x=>{const as=x.assets||[];const sum=re=>as.filter(a=>re.test(a.name)).reduce((t,a)=>t+(a.download_count||0),0);
      return {v:String(x.tag_name||'').replace(/^v/i,''),d:(x.published_at||'').slice(0,10),apk:sum(/\.apk$/i),upd:sum(/\.zip$/i)}})
      .filter(x=>x.v).sort((a,b)=>verNewer(a.v,b.v)?-1:verNewer(b.v,a.v)?1:0);
    S.stats={at:Date.now(),vs,err:''};LS.set('imm.stats',S.stats)}
  catch(e){S.stats=Object.assign({},S.stats||{vs:[]},{err:'Tidak bisa mengambil data unduhan',at:Date.now()-9*60e3})}
  statsBusy=false;if(S.page==='set')render();
}
function usersCard(){
  const st=S.stats;const vs=(st&&st.vs)||[];
  if(!vs.length)return `<section class="card" style="--i:2"><div class="ch"><span class="hic">${I.users}</span><h2>Pengguna</h2></div><div class="cb"><p class="foot" style="padding:0">${st&&st.err?esc(st.err)+'. Cek koneksi internet.':'Memuat jumlah unduhan…'}</p></div></section>`;
  const tot=x=>x.apk+x.upd;const est=Math.max(...vs.map(tot));const apk=vs.reduce((a,x)=>a+x.apk,0),upd=vs.reduce((a,x)=>a+x.upd,0);
  const last=vs[0];const show=vs.slice(0,6);const mx=Math.max(1,...show.map(tot));
  return `<section class="card" style="--i:2"><div class="ch"><span class="hic">${I.users}</span><h2>Pengguna</h2><span class="hint">dari unduhan GitHub</span></div><div class="cb">
    <div class="lt-big">${cnt(est)}<span class="u">perangkat</span></div><div class="lt-sub">perkiraan jumlah HP yang memasang IMM</div>
    <div class="lt-chips" style="margin:14px 0 16px"><span class="lt-chip"><b>${f0(tot(last))}</b>sudah di versi terbaru (${esc(last.v)})</span><span class="lt-chip"><b>${f0(apk)}</b>unduhan APK</span><span class="lt-chip"><b>${f0(upd)}</b>update kilat</span></div>
    <div class="legend"><span><i class="dot" style="background:var(--lg2)"></i>Unduh APK</span><span><i class="dot" style="background:var(--lg1)"></i>Update kilat</span></div>
    <div class="uv">${show.map(x=>`<div class="uv-r"><span class="uv-v">${esc(x.v)}</span><div class="uv-b"><div class="seg3" style="width:${Math.max(8,tot(x)/mx*100)}%">${x.apk?`<span style="flex:${x.apk};--c:var(--lg2);--o:var(--on2)">${x.apk}</span>`:''}${x.upd?`<span style="flex:${x.upd};--c:var(--lg1);--o:var(--on1)">${x.upd}</span>`:''}</div></div><span class="uv-n">${f0(tot(x))}</span></div>`).join('')}</div>
    <p class="foot" style="padding:10px 0 0">Satu HP mengunduh tiap versi sekali (APK atau update kilat), jadi angka tertinggi per versi dipakai sebagai perkiraan jumlah perangkat. APK yang dibagikan lewat WhatsApp atau dipindah antar-HP tidak ikut terhitung.</p>
  </div></section>`;
}

// ======================= UPDATE (seperti Active Coach) =======================
function verParts(v){return String(v||'').replace(/^v/i,'').split('.').map(x=>parseInt(x,10)||0)}
function verNewer(a,b){const x=verParts(a),y=verParts(b);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false}
function currentVersion(){return CFG.version||'dev'}
function livePlugin(){try{return NATIVE&&CAP.isPluginAvailable&&CAP.isPluginAvailable('CapacitorUpdater')?PL.CapacitorUpdater:null}catch(e){return null}}
function liveParse(rel){try{const m=String(rel.body||'').match(/<!--\s*imm-live\s+(\{[\s\S]*?\})\s*-->/);if(!m)return null;const info=JSON.parse(m[1]),asset=(rel.assets||[]).find(a=>a.name===info.asset);
  if(!asset||!info.native||!/^[0-9a-f]{64}$/.test(info.sha256||''))return null;return {native:String(info.native),sha256:info.sha256,size:Number(info.size)||asset.size||0,url:asset.browser_download_url}}catch(e){return null}}
function liveCompatible(rel){const l=rel&&rel.live;if(!l||!livePlugin()||!CFG.nativeBase||l.native!==CFG.nativeBase)return false;return (LS.get('imm.live.failed')||[]).indexOf(rel.version)<0}
async function fetchLatestRelease(){
  const r=await fetch(`https://api.github.com/repos/${CFG.updateRepo}/releases/latest`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
  if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();const apk=(j.assets||[]).find(a=>/\.apk$/i.test(a.name||''));
  return {live:liveParse(j),version:String(j.tag_name||'').replace(/^v/i,''),notes:String(j.body||''),url:apk?apk.browser_download_url:j.html_url,page:j.html_url,size:apk?apk.size:0};
}
function notesHtml(md,max){const s=String(md||'').replace(/\r/g,'').replace(/<!--[\s\S]*?-->/g,'');const i=s.search(/^## Catatan developer/m);const u=i>=0?s.slice(0,i):s;
  return esc(u).replace(/^## (.*)$/gm,'<b>$1</b>').replace(/^[-*] (.*)$/gm,'• $1').split('\n').filter(l=>l.trim()&&!/Unduh file \.apk/i.test(l)).slice(0,max||16).join('<br>')||'Perbaikan & peningkatan.'}
async function checkForUpdate(manual){
  if(window.IMM_SNAPSHOT){if(manual)toast('Pembaruan hanya bisa dicek di aplikasi Android');return}
  try{const rel=await fetchLatestRelease();const now=new Date();S.updChecked=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;LS.set('imm.upd.latest',rel);
    if(rel.version&&verNewer(rel.version,currentVersion())){const was=S.upd;S.upd=rel;if(!was||was.version!==rel.version){renderShell();if(!manual)toast(`Versi ${rel.version} tersedia · buka Pengaturan`)}if(manual&&S.page!=='set')setPage('set');else if(S.page==='set')render()}
    else{S.upd=null;if(manual)toast(`Sudah versi terbaru (${currentVersion()})`);if(S.page==='set')render();else renderShell()}}
  catch(e){const c=LS.get('imm.upd.latest');if(c&&verNewer(c.version,currentVersion())){S.upd=c;renderShell()}if(manual)toast('Tidak bisa memeriksa pembaruan: '+e.message)}
}
let updBusy=false,updFile='';
function updSet(pct,msg){const p=document.getElementById('updProg'),b=document.getElementById('updBar'),s=document.getElementById('updStatus');if(p)p.hidden=pct==null;if(b&&pct!=null)b.style.width=Math.max(3,Math.min(100,pct))+'%';if(s)s.innerHTML=msg||''}
async function runUpdate(){
  const rel=S.upd;if(!rel||updBusy)return;const go=document.getElementById('updGo');
  if(rel.live&&liveCompatible(rel)){updBusy=true;if(go)go.disabled=true;const L=livePlugin();let h=null;
    try{h=await L.addListener('download',e=>{const p=Number(e&&e.percent)||0;updSet(p,p<70?`Mengunduh… ${p}%`:'Memasang…')});
      updSet(2,'Mengunduh…');const b=await L.download({url:rel.live.url,version:rel.version,checksum:rel.live.sha256});updSet(100,'Memuat ulang aplikasi…');buzz(20);
      LS.set('imm.live.pending',{v:rel.version,from:currentVersion()});await L.set({id:b.id});
    }catch(e){LS.del('imm.live.pending');updBusy=false;if(go)go.disabled=false;updSet(null,'Update kilat gagal ('+esc(e.message||e)+'). Coba lagi atau unduh APK.');rel.live=null;render()}
    finally{try{h&&h.remove()}catch(x){}}return}
  const FT=PL.FileTransfer,FS=PL.Filesystem,FO=PL.FileOpener;
  if(!NATIVE||!FT||!FS||!FO){window.open(rel.url,'_blank');return}
  if(updFile)return installApk();
  updBusy=true;if(go){go.disabled=true;go.textContent='Mengunduh…'}let h=null;
  try{const name='IMM-'+rel.version+'.apk';try{await FS.deleteFile({path:name,directory:'CACHE'})}catch(e){}
    const uri=(await FS.getUri({path:name,directory:'CACHE'})).uri,path=String(uri).replace(/^file:\/\//,'');const total=rel.size||0;
    h=await FT.addListener('progress',p=>{const t=p.lengthComputable&&p.contentLength?p.contentLength:total;if(t)updSet(p.bytes/t*100,`Mengunduh ${(p.bytes/1048576).toFixed(1)} / ${(t/1048576).toFixed(1)} MB`)});
    updSet(1,'Mengunduh…');await FT.downloadFile({url:rel.url,path,progress:true,connectTimeout:20000,readTimeout:60000});
    updFile=uri;updBusy=false;buzz(20);if(go){go.disabled=false;go.textContent='Pasang versi '+rel.version}updSet(100,'Unduhan selesai. Pilih <b>Update</b> di layar berikutnya.');await installApk();
  }catch(e){updBusy=false;updFile='';if(go){go.disabled=false;go.textContent='Coba lagi'}updSet(null,'Unduhan gagal: '+esc(e.message||e)+'. Periksa internet lalu coba lagi.')}
  finally{try{h&&h.remove()}catch(x){}}
}
async function installApk(){try{await PL.FileOpener.open({filePath:updFile,contentType:'application/vnd.android.package-archive',openWithDefault:true});updSet(100,'Penginstal Android terbuka. Kalau diminta, izinkan <b>Instal aplikasi tidak dikenal</b> untuk IMM, lalu kembali dan ketuk tombol lagi.')}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
addEventListener('resize',()=>{placePills();placeKnobs()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{placePills();placeKnobs()});
try{PL.App&&PL.App.addListener&&PL.App.addListener('backButton',()=>{if(document.querySelector('.sheet')){closeSheet();return}if(S.page!=='home'){setPage('home');return}PL.App.exitApp&&PL.App.exitApp()})}catch(e){}
(function(){const ptr=document.getElementById('ptr');let y0=null,dy=0;
  addEventListener('touchstart',e=>{if(scrollY<=0&&!document.querySelector('.sheet'))y0=e.touches[0].clientY;else y0=null},{passive:true});
  addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){ptr.style.transition='none';ptr.style.transform=`translateY(${Math.min(dy*.5,70)-70}px) rotate(${dy*2}deg)`}},{passive:true});
  addEventListener('touchend',()=>{if(y0==null)return;ptr.style.transition='';if(dy>110){ptr.style.transform='translateY(0)';ptr.classList.add('spin');buzz(10);loadData(true).finally(()=>{ptr.classList.remove('spin');ptr.style.transform=''})}else ptr.style.transform='';y0=null;dy=0})})();

// ======================= RENDER =======================
function render(anim){
  renderShell();const m=document.getElementById('main');
  if(!D&&S.page!=='set'){m.className='';m.innerHTML=STATUS.state==='error'?`<section class="card">${emptyState('Data belum bisa dimuat',esc(STATUS.msg),false,I.crit)}<div class="empty" style="padding-top:0"><button class="btn press" data-reload>Coba lagi</button></div></section>`:`<div class="sk" style="height:46px;width:60%"></div><div class="sk" style="height:170px"></div><div class="sk" style="height:110px"></div><div class="sk" style="height:240px"></div>`;return}
  const html=(window.IMM_SNAPSHOT&&S.page!=='set'?`<div class="preview-note">Pratinjau dengan data contoh dari spreadsheet. Di aplikasi, semua data dibaca langsung dari Google Sheets.</div>`:'')+({home:pageHome,stock:pageStock,out:pageOut,mon:pageMon,set:pageSet})[S.page]();
  m.className='';if(anim&&!reduced()){void m.offsetWidth;m.className='enter'}m.innerHTML=html;placeKnobs();requestAnimationFrame(placeKnobs);if(anim)countUp(m);
  if(location.hash.slice(1)!==S.page)history.replaceState(null,'','#'+S.page);
}
function flyOut(el){
  const logo=document.getElementById('introLogo'),mark=document.getElementById('brandMark');
  if(reduced()||!logo||!mark||!el.animate){el.classList.add('out');setTimeout(()=>el.remove(),900);return}
  const a=logo.getBoundingClientRect(),b=mark.getBoundingClientRect();
  // pusat persegi kontainer: intro (56,37 dari 112x84), ikon brand (12,11 dari 24 di svg 22px di tengah kotak)
  const sx=a.left+a.width*56/112,sy=a.top+a.height*37/84,iconW=22*18/24;
  const scale=(a.width*100/112)/iconW;
  const bcx=b.left+b.width/2,bcy=b.top+b.height/2,o=-22/24;
  const fly=document.createElement('div');fly.className='fly';
  Object.assign(fly.style,{left:b.left+'px',top:b.top+'px',width:b.width+'px',height:b.height+'px'});
  fly.innerHTML=mark.innerHTML.replace('stroke="var(--accent-ink)"','stroke="currentColor"');
  document.body.appendChild(fly);mark.classList.add('hide');
  const cs=getComputedStyle(document.documentElement);const acc=cs.getPropertyValue('--accent').trim()||'#111820',ink=cs.getPropertyValue('--accent-ink').trim()||'#fff';
  const from=`translate(${sx-bcx}px,${sy-bcy-scale*o}px) scale(${scale})`;
  logo.style.opacity='0';el.classList.add('leaving');
  const anim=fly.animate([{transform:from,backgroundColor:'rgba(17,24,32,0)',color:'#F6F7F4',borderRadius:'2px'},{offset:.7,backgroundColor:'rgba(17,24,32,0)',color:'#F6F7F4'},{transform:'translate(0px,0px) scale(1)',backgroundColor:acc,color:ink,borderRadius:'12px'}],{duration:1050,easing:'cubic-bezier(.65,0,.22,1)',fill:'forwards'});
  setTimeout(()=>{el.style.pointerEvents='none'},300);
  anim.onfinish=()=>{mark.classList.remove('hide');fly.animate([{opacity:1},{opacity:0}],{duration:180,fill:'forwards'}).onfinish=()=>fly.remove();el.remove()};
}
(function boot(){
  applyTheme();const t0=performance.now();
  if(!window.IMM_SNAPSHOT){const c=LS.get(CACHE_KEY);if(c&&c.cont){D=c;reindex()}}
  const p=loadData();
  const minT=reduced()?0:2300;let shown=false;
  const reveal=()=>{if(shown)return;shown=true;const el=document.getElementById('intro');render(true);liveReady();
    if(el)flyOut(el);
    setTimeout(()=>{checkForUpdate(false);showWhatsNew(false)},1500)};
  const go=()=>setTimeout(reveal,Math.max(0,minT-(performance.now()-t0)));
  if(D)go();else{p.finally(go);setTimeout(reveal,8000)}
  let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(Date.now()-hiddenAt>5*60e3){loadData();checkForUpdate(false)}});
})();
</script>
